name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven (skip tests)
        run: mvn -B -DskipTests package

      - name: List target contents
        run: ls -la target || true

      - name: Upload fat jar
        uses: actions/upload-artifact@v7
        with:
          name: fhir-pkg-tool.jar
          path: target/fhir-pkg-tool.jar
          if-no-files-found: error

  native-smoke:
    name: Native Smoke (Linux x64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up GraalVM JDK 21
        uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm-community
          java-version: '21'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven

      - name: Build native image (skip tests)
        run: mvn -B -DskipTests -Pnative verify

      - name: Smoke test native binary
        shell: bash
        run: |
          BIN="./target/fhir-pkg-tool"
          if [ ! -f "$BIN" ]; then
            BIN="./fhir-pkg-tool"
          fi
          if [ ! -f "$BIN" ]; then
            echo "Native binary not found in ./target or repo root" >&2
            ls -la target || true
            ls -la . || true
            exit 1
          fi
          "$BIN" --help
          "$BIN" --version

          # --help never constructs a FHIR worker context, which is exactly where
          # a resource missing from the native image surfaces: v0.4.0 shipped
          # binaries that died with a NullPointerException on every real run while
          # this step stayed green. The run below builds that context, needs no
          # network, and fails if any bundled data resource is unreachable again.
          work="$(mktemp -d)"
          mkdir -p "${work}/profiles"
          "$BIN" --profiles-dir "${work}/profiles" --out "${work}/out" --no-auto-core

  action-smoke:
    name: Action Smoke
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up GraalVM JDK 21
        uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm-community
          java-version: '21'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven

      - name: Build native image (skip tests)
        run: mvn -B -DskipTests -Pnative verify

      # Run against the binary just built rather than a published release, so a
      # regression is caught before it is tagged. The download path is covered by
      # the release workflow's own asset names.
      - name: Run the action
        id: pkgs
        uses: ./
        with:
          binary: target/fhir-pkg-tool
          packages: hl7.fhir.r4.core@4.0.1
          skip-deps: 'true'
          cache: 'false'

      - name: Verify the standard cache was populated
        shell: bash
        run: |
          set -euo pipefail
          echo "Action reported out-dir: ${{ steps.pkgs.outputs.out-dir }}"
          sd="${HOME}/.fhir/packages/hl7.fhir.r4.core#4.0.1/package/StructureDefinition-Patient.json"
          if [ ! -s "${sd}" ]; then
            echo "Expected ${sd} to exist" >&2
            ls -la "${HOME}/.fhir/packages" || true
            exit 1
          fi
          grep -q '"snapshot"' "${sd}"
          echo "OK: package installed in the standard FHIR cache, snapshot present."
