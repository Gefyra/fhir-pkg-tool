name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-jar:
    name: Build Jar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # The tag drives the version the CLI reports via --version.
      - name: Build (skip tests)
        shell: bash
        run: mvn -B -DskipTests -Drevision="${GITHUB_REF_NAME#v}" package

      - name: Upload jar artifact
        uses: actions/upload-artifact@v7
        with:
          name: fhir-pkg-tool.jar
          path: target/fhir-pkg-tool.jar
          if-no-files-found: error

  build-native:
    name: Build Native (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
            ext: ""
          - runner: ubuntu-24.04-arm
            target: linux-arm64
            ext: ""
          - runner: windows-2025
            target: windows-x64
            ext: ".exe"
          - runner: macos-15
            target: macos-arm64
            ext: ""
          - runner: macos-15-intel
            target: macos-x64
            ext: ""
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up GraalVM JDK 21
        uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm-community
          java-version: '21'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven

      - name: Build native image (skip tests)
        shell: bash
        run: mvn -B -DskipTests -Drevision="${GITHUB_REF_NAME#v}" -Pnative verify

      - name: Rename native executable
        shell: bash
        run: |
          BIN="target/fhir-pkg-tool${{ matrix.ext }}"
          OUT="target/fhir-pkg-tool-${{ matrix.target }}${{ matrix.ext }}"
          if [ ! -f "$BIN" ]; then
            BIN="fhir-pkg-tool${{ matrix.ext }}"
          fi
          if [ ! -f "$BIN" ]; then
            echo "Expected native binary not found in target/ or repo root" >&2
            ls -la target || true
            ls -la . || true
            exit 1
          fi
          mv "$BIN" "$OUT"

      - name: Upload native artifact
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.target }}
          path: target/fhir-pkg-tool-${{ matrix.target }}${{ matrix.ext }}
          if-no-files-found: error

  release:
    name: Publish Release
    needs: [build-jar, build-native]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # The release notes are the curated CHANGELOG.md section for this tag. Failing here is
      # deliberate: a release without an entry would otherwise ship a set of Dependabot titles
      # as its description, and nobody would notice until after the tag is public.
      - name: Extract release notes from CHANGELOG.md
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"

          # Everything between this version's heading and the next one - or the link
          # definitions at the end of the file, which would otherwise be swallowed by
          # the last section. Blank lines after the heading are skipped, trailing ones
          # are dropped by the command substitution.
          notes="$(awk -v want="## [${version}]" '
            index($0, want) == 1                       { found = 1; next }
            found && /^## \[/                          { exit }
            found && /^\[[^]]+\]:[[:space:]]/            { exit }
            found && !started && /^[[:space:]]*$/      { next }
            found                                      { started = 1; print }
          ' CHANGELOG.md)"

          if [ -z "${notes//[[:space:]]/}" ]; then
            echo "::error::CHANGELOG.md has no section '## [${version}]'. Add one before tagging ${GITHUB_REF_NAME}."
            exit 1
          fi

          printf '%s\n' "${notes}" > release-notes.md
          echo "Release notes for ${version}:"
          cat release-notes.md

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            dist/fhir-pkg-tool.jar/fhir-pkg-tool.jar
            dist/native-linux-arm64/fhir-pkg-tool-linux-arm64
            dist/native-linux-x64/fhir-pkg-tool-linux-x64
            dist/native-macos-arm64/fhir-pkg-tool-macos-arm64
            dist/native-macos-x64/fhir-pkg-tool-macos-x64
            dist/native-windows-x64/fhir-pkg-tool-windows-x64.exe
          generate_release_notes: true
